# Home Assistant add-on, installed from https://github.com/eaugum/frame-art (see README.md).
# Bump version for every change, with a line in CHANGELOG.md; HA offers the update.
name: Frame Art
version: "0.14.0"
slug: frame_art
description: Tilfeldig rotasjon i The Frames Kunstmodus, fra en mappe, museer, Commons, NASA og film, med kildene du krysser av, Morgenbildet og kveldens serie
url: https://github.com/eaugum/frame-art
arch: [aarch64, amd64]
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:image-frame
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: API for Home Assistant and Frame TV (bytt bilde, Kunstmodus)
services:
  - mqtt:want  # Home Assistant sees it as a device through Mosquitto; it runs without too
homeassistant_api: true  # Følg musikken reads the Spotify player from Home Assistant
map:
  - type: media
    read_only: true
# Here only what the add-on needs to start: the TV, Stasera and the sources. The rest (the interval, the times,
# Morgenbildet, how many pictures stay on the TV ...) is on the add-on's page; the weather is for Home Assistant's
# home, unless latitude and longitude are given here.
options:
  tv_host: 10.1.2.36
  stasera_url: "https://www.stasera.app"
  # A source: category (several sources can share one; without it, the name), name, type, query (several with |),
  # and if needed years ("1800-1930"), weight (1-10, how often) and enabled. Only pictures close to 16:9 are used,
  # cropped to fill the screen. Types and queries: README.md.
  sources:
    # Mine egne
    - {category: Mine bilder, name: Mine bilder, type: folder, query: /media/frame-art}
    # Malerier
    - {category: Malerier, name: Landskap og hav (The Met), type: met, query: landscape|seascape, years: 1800-1930}
    - {category: Malerier, name: Rijksmuseum, type: rijksmuseum, query: landschap|zee, years: 1800-1930}
    - {category: Malerier, name: Nasjonalmuseet, type: nasjonalmuseet,
       query: Hans Gude|Harald Sohlberg|Edvard Munch|Nikolai Astrup|Theodor Kittelsen}
    - {category: Malerier, name: Cleveland, type: cleveland, query: landscape|seascape, years: 1800-1930}
    - {category: Malerier, name: Dansk gullalder (SMK), type: smk, query: "*", years: 1800-1900}
    - {category: Malerier, name: Impresjonistene, type: commons,
       query: Paintings by Claude Monet|Paintings by Camille Pissarro|Paintings by Alfred Sisley|Paintings by Vincent van Gogh}
    - {category: Malerier, name: Romantikken, type: commons,
       query: Paintings by Caspar David Friedrich|Paintings by Joseph Mallord William Turner|Paintings by Ivan Aivazovsky|Paintings by Albert Bierstadt}
    - {category: Malerier, name: Nordisk lys, type: commons,
       query: Paintings by Peder Severin Krøyer|Paintings by Akseli Gallen-Kallela|Paintings by Anders Zorn|Paintings by Vilhelm Hammershøi}
    # Abstrakt
    - {category: Abstrakt, name: Abstrakt, type: commons,
       query: Paintings by Wassily Kandinsky|Paintings by Piet Mondrian|Paintings by Kazimir Malevich|Paintings by Paul Klee|Paintings by Robert Delaunay|Paintings by Hilma af Klint|Paintings by Sophie Taeuber-Arp|Paintings by Lyubov Popova}
    # Japan
    - {category: Japan, name: Japanske tresnitt (The Met), type: met, query: medium=Prints&q=Hiroshige|medium=Prints&q=Hokusai}
    - {category: Japan, name: Japanske tresnitt (Cleveland), type: cleveland,
       query: type=Print&q=Hiroshige|type=Print&q=Hokusai}
    - {category: Japan, name: Kawase Hasui, type: commons, query: Kawase Hasui}
    # Plakater
    - {category: Plakater, name: Art nouveau-plakater, type: commons, query: Art Nouveau posters|Posters by Alfons Mucha}
    - {category: Plakater, name: Art deco-plakater, type: commons, query: Art Deco posters}
    - {category: Plakater, name: Nasjonalparkplakater, type: commons, query: "WPA posters, National Park Service"}
    # Natur og rommet
    - {category: Natur og rommet, name: Botanikk, type: wellcome, query: botanical}
    - {category: Natur og rommet, name: Naturfoto, type: commons,
       query: Featured pictures of landscapes|Featured pictures of mountains|Featured pictures of Norway}
    - {category: Natur og rommet, name: Rommet (NASA), type: nasa, query: nebula|spiral galaxy|star cluster}
    - {category: Natur og rommet, name: Jorda fra rommet, type: nasa, query: earth from space}
    - {category: Natur og rommet, name: Astrofoto, type: commons, query: Featured pictures of astronomy}
    # Film og serier: fra Stasera (stasera_url, og koblet på add-on-siden)
    - {category: Film, name: Filmplakater, type: commons, query: 1920s film posters|Film posters of the United States}
    - {category: Film, name: Stumfilm, type: commons, query: Film stills, enabled: false}
    - {category: Film, name: Det vi ser på, type: stasera, query: watching|wantToStart}
    - {category: Film, name: Filmene våre, type: stasera, query: movies}
    - {category: Film, name: Anbefalt, type: stasera, query: recommendations}
schema:
  tv_host: str
  tmdb_key: password?
  latitude: float?
  longitude: float?
  stasera_url: url?
  back_app: str?
  sources:
    - name: str
      category: str?
      type: list(folder|met|rijksmuseum|nasjonalmuseet|cleveland|smk|commons|nasa|wellcome|tmdb|stasera)
      query: str?
      years: str?
      shape: list(wide|any)?
      weight: int(1,10)?
      enabled: bool?
