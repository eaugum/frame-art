# Home Assistant add-on, installed from https://github.com/eaugum/frame-art (see DOCS.md).
# Bump version for every change, with a line in CHANGELOG.md; HA offers the update.
name: Frame Art
version: "0.33.0"
slug: frame_art
description: A living gallery in The Frame's Art Mode, from museums, NASA and your own photos, with a morning picture and Follow the music
url: https://github.com/eaugum/frame-art
arch: [aarch64, amd64]
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:image-frame
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: API for scripts and apps (change the picture, Art Mode)
services:
  - mqtt:want  # Home Assistant sees it as a device through Mosquitto; it runs without too
homeassistant_api: true  # Follow the music reads the Spotify player, and language: auto the language, from Home Assistant
hassio_api: true  # a key the add-on makes is written into its own options (api_key)
map:
  - type: media
    read_only: true
# What's set up once: the TV, the key, Home Assistant's entities and the sources. What changes from day to
# day (the sources that are ticked, the interval, the times, the switches) is on the add-on's page.
options:
  tv_host: ""
  # The language of the morning picture and the posters: auto follows Home Assistant's system language (English
  # when it's neither English nor Norwegian)
  language: auto
  # The key for the API; left empty, the add-on makes one and writes it here
  api_key: ""
  # The morning picture's weather (met.no in Home Assistant); empty: no weather
  weather_entity: weather.forecast_home
  # The TV in Home Assistant, turned on before the morning picture and tonight's show when it's off; empty: never
  tv_entity: ""
  # Who's home: a zone (someone in it), a person, device_tracker, group, binary_sensor or input_boolean; with "Only
  # when someone is home" on, Follow the music and turning the TV on wait for it. Empty: always home
  home_entity: zone.home
  # Calendars whose events today are in the morning picture, and a Nord Pool or Tibber sensor for the electricity price
  calendars: []
  price_entity: ""
  stasera_url: "https://www.stasera.app"
  # An app opened when Art Mode goes off while the TV is on (e.g. a home screen app); empty: none
  back_app: ""
  # The services: how each is asked for pictures, with its address. A source below says which one with its type. Add
  # your own, or delete any of them; "services: []" removes them all. Fields: DOCS.md.
  services:
    - name: met
      query: landscape
      url: "https://collectionapi.metmuseum.org/public/collection/v1.1/search?hasImages=true&isPublicDomain=true&medium=Paintings&limit=100&q={query}&offset={offset}"
      items: objectIDs
      steps:
        - "https://collectionapi.metmuseum.org/public/collection/v1/objects/{id}"
      require:
        - step1.isPublicDomain=true
        - step1.classification=Paintings
      unless: medium
      image: "{step1.primaryImage}"
      thumb: "{step1.primaryImageSmall}"
      title: "{step1.title}, {step1.artistDisplayName} ({step1.objectDate}) | {step1.title} ({step1.objectDate}) | {step1.title}"
    - name: rijksmuseum
      query: landschap
      url: "https://data.rijksmuseum.nl/search/collection?description={query}&type=painting&imageAvailable=true"
      accept: application/ld+json
      items: orderedItems
      next: next.id
      steps:
        - "{id}"
        - "{step1.shows.0.id}"
        - "{step2.digitally_shown_by.0.id}"
        - "{step3.access_point.0.id|before:/full/}/info.json"
      require:
        - step1~creativecommons.org/publicdomain/
      width: step4.width
      height: step4.height
      image: "{step3.access_point.0.id|before:/full/}/full/!4000,4000/0/default.jpg"
      thumb: "{step3.access_point.0.id|before:/full/}/full/!480,480/0/default.jpg"
      title: "{step1.identified_by.?300388277.content} ({step1.produced_by.timespan.begin_of_the_begin|year}) | {step1.identified_by.?300388277.content} | {step1.identified_by.1.content}"
    - name: commons
      url: "https://commons.wikimedia.org/w/api.php?action=query&format=json&formatversion=2&generator=search&gsrnamespace=6&gsrlimit=500&gsroffset={offset}&gsrsearch=deepcat:%22{query}%22&prop=imageinfo&iiprop=size"
      items: query.pages
      id: title
      pages: 10
      pause: 0.5
      width: imageinfo.0.width
      height: imageinfo.0.height
      steps:
        - "https://commons.wikimedia.org/w/api.php?action=query&format=json&formatversion=2&titles={id}&prop=imageinfo&iiprop=url|size|extmetadata&iiurlwidth=3840&iiextmetadatafilter=ObjectName|Artist|DateTimeOriginal"
      image: "{step1.query.pages.0.imageinfo.0.thumburl} | {step1.query.pages.0.imageinfo.0.url}"
      thumb: "https://commons.wikimedia.org/wiki/Special:FilePath/{id}?width=480"
      title: "{step1.query.pages.0.imageinfo.0.extmetadata.ObjectName.value}, {step1.query.pages.0.imageinfo.0.extmetadata.Artist.value} ({step1.query.pages.0.imageinfo.0.extmetadata.DateTimeOriginal.value|year}) | {step1.query.pages.0.imageinfo.0.extmetadata.ObjectName.value}, {step1.query.pages.0.imageinfo.0.extmetadata.Artist.value} | {step1.query.pages.0.imageinfo.0.extmetadata.ObjectName.value} | {id|file|part:1}, {id|file|part:0} | {id|file}"
    - name: nasjonalmuseet
      query: Hans Gude|Harald Sohlberg|Edvard Munch|Nikolai Astrup|Theodor Kittelsen
      url: "https://commons.wikimedia.org/w/api.php?action=query&format=json&formatversion=2&generator=search&gsrnamespace=6&gsrlimit=500&gsroffset={offset}&gsrsearch=incategory:%22Paintings%20by%20{query}%20in%20the%20Nasjonalmuseet%20for%20kunst,%20arkitektur%20og%20design%22&prop=imageinfo&iiprop=size"
      items: query.pages
      id: title
      pause: 0.5
      width: imageinfo.0.width
      height: imageinfo.0.height
      steps:
        - "https://commons.wikimedia.org/w/api.php?action=query&format=json&formatversion=2&titles={id}&prop=imageinfo&iiprop=url|size&iiurlwidth=3840"
      image: "{step1.query.pages.0.imageinfo.0.thumburl} | {step1.query.pages.0.imageinfo.0.url}"
      thumb: "https://commons.wikimedia.org/wiki/Special:FilePath/{id}?width=480"
      title: "{id|file|part:1}, {id|file|part:0} | {id|file}"
    - name: cleveland
      query: landscape
      url: "https://openaccess-api.clevelandart.org/api/artworks/?type=Painting&has_image=1&cc0=1&limit=100&fields=id,images&q={query}&skip={offset}"
      items: data
      pages: 10
      width: images.print.width
      height: images.print.height
      steps:
        - "https://openaccess-api.clevelandart.org/api/artworks/{id}"
      require:
        - step1.data.share_license_status=CC0
      image: "{step1.data.images.print.url}"
      thumb: "{step1.data.images.web.url}"
      title: "{step1.data.title}, {step1.data.creators.0.description|before: (} ({step1.data.creation_date}) | {step1.data.title} ({step1.data.creation_date}) | {step1.data.title}"
    - name: smk
      query: "*"
      url: "https://api.smk.dk/api/v1/art/search/?keys={query}&rows=100&filters=%5Bhas_image:true%5D,%5Bpublic_domain:true%5D,%5Bobject_names:maleri%5D&fields=object_number,image_width,image_height,image_iiif_id&offset={offset}"
      items: items
      id: object_number
      pages: 20
      width: image_width
      height: image_height
      steps:
        - "https://api.smk.dk/api/v1/art/?object_number={id}"
      image: "{step1.items.0.image_iiif_id}/full/!3840,3840/0/default.jpg"
      thumb: "{step1.items.0.image_iiif_id}/full/!480,480/0/default.jpg"
      title: "{step1.items.0.titles.0.title}, {step1.items.0.artist.0} ({step1.items.0.production_date.0.period}) | {step1.items.0.titles.0.title}"
    - name: nasa
      query: nebula
      url: "https://images-api.nasa.gov/search?media_type=image&page_size=100&q={query}&page={page}"
      items: collection.items
      id: data.0.nasa_id
      steps:
        - "https://images-api.nasa.gov/search?nasa_id={id}"
      image: "https://images-assets.nasa.gov/image/{id}/{id}~orig.jpg | https://images-assets.nasa.gov/image/{id}/{id}~large.jpg"
      thumb: "https://images-assets.nasa.gov/image/{id}/{id}~thumb.jpg"
      title: "{step1.collection.items.0.data.0.title} ({step1.collection.items.0.data.0.date_created|year}) | {id}"
    - name: wellcome
      query: botanical
      url: "https://api.wellcomecollection.org/catalogue/v2/images?locations.license=pdm,cc-0&pageSize=100&query={query}&page={page}"
      items: results
      ratio: aspectRatio
      steps:
        - "https://api.wellcomecollection.org/catalogue/v2/images/{id}"
        - "{step1.locations.?iiif-image.url}"
      width: step2.width
      height: step2.height
      image: "{step1.locations.?iiif-image.url|before:/info.json}/full/!3840,3840/0/default.jpg"
      thumb: "{step1.locations.?iiif-image.url|before:/info.json}/full/!480,480/0/default.jpg"
      title: "{step1.source.title}"
    # These ask Stasera (stasera_url, and linked on the add-on's page)
    - name: stasera
      query: watching|movies
      url: "{stasera}/tv/home?parts={query}"
      items: "{query}"
      id: "{kind}:{tmdbId}"
      hours: 6
      image: "{stasera}/tv/img/original{textlessBackdropPath} | {stasera}/tv/img/original{backdropPath}"
      thumb: "{stasera}/tv/img/w500{textlessBackdropPath} | {stasera}/tv/img/w500{backdropPath}"
      title: "{title} ({year}) | {title}"
    - name: stasera-recommendations
      url: "{stasera}/tv/recommendations"
      items: items
      id: "{kind}:{tmdbId}"
      hours: 6
      image: "{stasera}/tv/img/original{textlessBackdropPath} | {stasera}/tv/img/original{backdropPath}"
      thumb: "{stasera}/tv/img/w500{textlessBackdropPath} | {stasera}/tv/img/w500{backdropPath}"
      title: "{title} ({year}) | {title}"
    - name: stasera-art
      url: "{stasera}/tv/art?{query}"
      items: items.*.backdrops
      id: "{kind}:{tmdbId}:{path}"
      wait: pending
      width: width
      height: height
      image: "{stasera}/tv/img/original{path}"
      thumb: "{stasera}/tv/img/w780{path}"
      title: "{title} ({year}) | {title}"
  # A source: category (several sources can share one; without it, the name), name, type and query (several with
  # |). The type is a service above, or folder. Every source here is used; tick them on the add-on's page. Only
  # pictures close to 16:9, cropped to fill the screen. Types and queries: DOCS.md.
  sources:
    # Your own
    - {category: My pictures, name: My pictures, type: folder, query: /media/frame-art}
    # Paintings
    - {category: Paintings, name: Landscapes and seascapes (The Met), type: met, query: landscape|seascape}
    - {category: Paintings, name: Rijksmuseum, type: rijksmuseum, query: landschap|zee}
    - {category: Paintings, name: Nasjonalmuseet, type: nasjonalmuseet,
       query: Hans Gude|Harald Sohlberg|Edvard Munch|Nikolai Astrup|Theodor Kittelsen}
    - {category: Paintings, name: Cleveland, type: cleveland, query: landscape|seascape}
    - {category: Paintings, name: Danish Golden Age (SMK), type: smk, query: "*"}
    - {category: Paintings, name: The Impressionists, type: commons,
       query: Paintings by Claude Monet|Paintings by Camille Pissarro|Paintings by Alfred Sisley|Paintings by Vincent van Gogh}
    - {category: Paintings, name: Romanticism, type: commons,
       query: Paintings by Caspar David Friedrich|Paintings by Joseph Mallord William Turner|Paintings by Ivan Aivazovsky|Paintings by Albert Bierstadt}
    - {category: Paintings, name: Nordic light, type: commons,
       query: Paintings by Peder Severin Krøyer|Paintings by Akseli Gallen-Kallela|Paintings by Anders Zorn|Paintings by Vilhelm Hammershøi}
    # Abstract
    - {category: Abstract, name: Abstract, type: commons,
       query: Paintings by Wassily Kandinsky|Paintings by Piet Mondrian|Paintings by Kazimir Malevich|Paintings by Paul Klee|Paintings by Robert Delaunay|Paintings by Hilma af Klint|Paintings by Sophie Taeuber-Arp|Paintings by Lyubov Popova}
    # Japan
    - {category: Japan, name: Japanese woodblock prints (The Met), type: met, query: medium=Prints&q=Hiroshige|medium=Prints&q=Hokusai}
    - {category: Japan, name: Japanese woodblock prints (Cleveland), type: cleveland,
       query: type=Print&q=Hiroshige|type=Print&q=Hokusai}
    - {category: Japan, name: Kawase Hasui, type: commons, query: Kawase Hasui}
    # Posters
    - {category: Posters, name: Art Nouveau posters, type: commons, query: Art Nouveau posters|Posters by Alfons Mucha}
    - {category: Posters, name: National park posters, type: commons, query: "WPA posters, National Park Service"}
    # Nature and space
    - {category: Nature and space, name: Botany, type: wellcome, query: botanical}
    - {category: Nature and space, name: Nature photos, type: commons,
       query: Featured pictures of landscapes|Featured pictures of mountains|Featured pictures of Norway}
    - {category: Nature and space, name: Space (NASA), type: nasa, query: nebula|spiral galaxy|star cluster}
    - {category: Nature and space, name: Earth from space, type: nasa, query: earth from space}
    - {category: Nature and space, name: Astrophotography, type: commons, query: Featured pictures of astronomy}
    # Film and TV: from Stasera (stasera_url, and linked on the add-on's page)
    - {category: Film, name: Film posters, type: commons, query: 1920s film posters|Film posters of the United States}
    - {category: Film, name: What we're watching, type: stasera, query: watching|wantToStart}
    - {category: Film, name: Our movies, type: stasera, query: movies}
    - {category: Film, name: Recommended, type: stasera-recommendations}
    # Film and animation: backdrops without text, from Stasera
    - {name: Pixar, type: stasera-art, query: company=3}
    - {name: Disney, type: stasera-art, query: company=6125|company=3166&genre=16}
    - {name: Star Wars, type: stasera-art,
       query: collection=10|movie=330459|movie=348350|tv=4194|tv=82856|tv=83867|tv=115036|tv=92830|tv=114461}
    - {name: Studio Ghibli, type: stasera-art, query: company=10342}
    - {name: DreamWorks, type: stasera-art, query: company=521}
    - {name: Marvel, type: stasera-art, query: company=420}
schema:
  tv_host: str
  language: list(auto|en|nb)?
  api_key: password?
  weather_entity: match(^(weather\..+)?$)?
  tv_entity: match(^(media_player\..+)?$)?
  home_entity: match(^((zone|person|device_tracker|group|binary_sensor|input_boolean)\..+)?$)?
  calendars:
    - match(^calendar\..+$)
  price_entity: match(^(sensor\..+)?$)?
  stasera_url: url?
  back_app: str?
  services:
    - name: str
      query: str?
      url: str?
      accept: str?
      items: str?
      id: str?
      next: str?
      wait: str?
      pages: int?
      pause: float?
      hours: float?
      steps:
        - str?
      require:
        - str?
      unless: str?
      image: str?
      thumb: str?
      title: str?
      width: str?
      height: str?
      ratio: str?
  sources:
    - name: str
      category: str?
      type: str
      query: str?
      url: str?
      accept: str?
      items: str?
      id: str?
      next: str?
      wait: str?
      pages: int?
      pause: float?
      hours: float?
      steps:
        - str?
      require:
        - str?
      unless: str?
      image: str?
      thumb: str?
      title: str?
      width: str?
      height: str?
      ratio: str?
