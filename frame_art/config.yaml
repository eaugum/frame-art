# Home Assistant add-on, installed from https://github.com/eaugum/frame-art (see DOCS.md).
# Bump version for every change, with a line in CHANGELOG.md; HA offers the update.
name: Frame Art
version: "0.20.1"
slug: frame_art
description: A living gallery in The Frame's Art Mode, from museums, NASA and your own photos, with a morning picture and Follow the music
url: https://github.com/eaugum/frame-art
arch: [aarch64, amd64]
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:image-frame
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: API for scripts and apps (change the picture, Art Mode)
services:
  - mqtt:want  # Home Assistant sees it as a device through Mosquitto; it runs without too
homeassistant_api: true  # Follow the music reads the Spotify player, and language: auto the language, from Home Assistant
hassio_api: true  # a key the add-on makes is written into its own options (api_key)
map:
  - type: media
    read_only: true
# What's set up once: the TV, the key, Home Assistant's entities and the sources. What changes from day to
# day (the sources that are ticked, the interval, the times, the switches) is on the add-on's page.
options:
  tv_host: ""
  # The language of the morning picture and the posters: auto follows Home Assistant's system language (English
  # when it's neither English nor Norwegian)
  language: auto
  # The key for the API; left empty, the add-on makes one and writes it here
  api_key: ""
  # The morning picture's weather (met.no in Home Assistant); empty: no weather
  weather_entity: weather.forecast_home
  # The TV in Home Assistant, turned on before the morning picture when it's off; empty: never
  tv_entity: ""
  # Calendars whose events today are in the morning picture, and a Nord Pool or Tibber sensor for the electricity price
  calendars: []
  price_entity: ""
  stasera_url: "https://www.stasera.app"
  # An app opened when Art Mode goes off while the TV is on (e.g. a home screen app); empty: none
  back_app: ""
  # A source: category (several sources can share one; without it, the name), name, type and query (several with
  # |). Every source here is used; tick them on the add-on's page. Only pictures close to 16:9, cropped to fill the
  # screen. Types and queries: DOCS.md.
  sources:
    # Your own
    - {category: My pictures, name: My pictures, type: folder, query: /media/frame-art}
    # Paintings
    - {category: Paintings, name: Landscapes and seascapes (The Met), type: met, query: landscape|seascape}
    - {category: Paintings, name: Rijksmuseum, type: rijksmuseum, query: landschap|zee}
    - {category: Paintings, name: Nasjonalmuseet, type: nasjonalmuseet,
       query: Hans Gude|Harald Sohlberg|Edvard Munch|Nikolai Astrup|Theodor Kittelsen}
    - {category: Paintings, name: Cleveland, type: cleveland, query: landscape|seascape}
    - {category: Paintings, name: Danish Golden Age (SMK), type: smk, query: "*"}
    - {category: Paintings, name: The Impressionists, type: commons,
       query: Paintings by Claude Monet|Paintings by Camille Pissarro|Paintings by Alfred Sisley|Paintings by Vincent van Gogh}
    - {category: Paintings, name: Romanticism, type: commons,
       query: Paintings by Caspar David Friedrich|Paintings by Joseph Mallord William Turner|Paintings by Ivan Aivazovsky|Paintings by Albert Bierstadt}
    - {category: Paintings, name: Nordic light, type: commons,
       query: Paintings by Peder Severin Krøyer|Paintings by Akseli Gallen-Kallela|Paintings by Anders Zorn|Paintings by Vilhelm Hammershøi}
    # Abstract
    - {category: Abstract, name: Abstract, type: commons,
       query: Paintings by Wassily Kandinsky|Paintings by Piet Mondrian|Paintings by Kazimir Malevich|Paintings by Paul Klee|Paintings by Robert Delaunay|Paintings by Hilma af Klint|Paintings by Sophie Taeuber-Arp|Paintings by Lyubov Popova}
    # Japan
    - {category: Japan, name: Japanese woodblock prints (The Met), type: met, query: medium=Prints&q=Hiroshige|medium=Prints&q=Hokusai}
    - {category: Japan, name: Japanese woodblock prints (Cleveland), type: cleveland,
       query: type=Print&q=Hiroshige|type=Print&q=Hokusai}
    - {category: Japan, name: Kawase Hasui, type: commons, query: Kawase Hasui}
    # Posters
    - {category: Posters, name: Art Nouveau posters, type: commons, query: Art Nouveau posters|Posters by Alfons Mucha}
    - {category: Posters, name: Art Deco posters, type: commons, query: Art Deco posters}
    - {category: Posters, name: National park posters, type: commons, query: "WPA posters, National Park Service"}
    # Nature and space
    - {category: Nature and space, name: Botany, type: wellcome, query: botanical}
    - {category: Nature and space, name: Nature photos, type: commons,
       query: Featured pictures of landscapes|Featured pictures of mountains|Featured pictures of Norway}
    - {category: Nature and space, name: Space (NASA), type: nasa, query: nebula|spiral galaxy|star cluster}
    - {category: Nature and space, name: Earth from space, type: nasa, query: earth from space}
    - {category: Nature and space, name: Astrophotography, type: commons, query: Featured pictures of astronomy}
    # Film and TV: from Stasera (stasera_url, and linked on the add-on's page)
    - {category: Film, name: Film posters, type: commons, query: 1920s film posters|Film posters of the United States}
    - {category: Film, name: What we're watching, type: stasera, query: watching|wantToStart}
    - {category: Film, name: Our movies, type: stasera, query: movies}
    - {category: Film, name: Recommended, type: stasera, query: recommendations}
schema:
  tv_host: str
  language: list(auto|en|nb)?
  api_key: password?
  weather_entity: match(^(weather\..+)?$)?
  tv_entity: match(^(media_player\..+)?$)?
  calendars:
    - match(^calendar\..+$)
  price_entity: match(^(sensor\..+)?$)?
  stasera_url: url?
  back_app: str?
  sources:
    - name: str
      category: str?
      type: list(folder|met|rijksmuseum|nasjonalmuseet|cleveland|smk|commons|nasa|wellcome|stasera)
      query: str?
