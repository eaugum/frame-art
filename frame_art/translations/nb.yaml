configuration:
  tv_host:
    name: TV-ens adresse
    description: IP-adressen til The Frame på hjemmenettet.
  language:
    name: Språk
    description: >-
      Språket på veggen, i Home Assistant og på add-on-siden. auto følger språket i Home Assistant (engelsk når det
      verken er engelsk eller norsk).
  api_key:
    name: API-nøkkel
    description: >-
      Nøkkelen Frame TV og andre sender (art_key i Frame TV). Står den tom, lager add-on-et en og skriver den her.
  weather_entity:
    name: Vær
    description: Vær-entiteten til Morgenbildet (met.no). Tom gir ikke vær.
  tv_entity:
    name: TV-en i Home Assistant
    description: >-
      En media_player som slås på før Morgenbildet når TV-en er av. Tom: aldri.
  calendars:
    name: Kalendere
    description: Kalendere med avtaler i dag som kommer på Morgenbildet.
  price_entity:
    name: Strømpris
    description: >-
      En sensor fra Nord Pool eller Tibber; Morgenbildet viser dagens priser og de billigste og dyreste timene.
  stasera_url:
    name: Stasera
    description: >-
      Adressen til Stasera, for kveldens serie, skjermspareren og filmkildene. Kobles på add-on-siden.
  sources:
    name: Kilder
    description: >-
      Hver med kategori, navn, type og søk (flere med |). Alle kildene her brukes; kryss dem av på add-on-siden. Se
      README for typene.
network:
  8099/tcp: API for Home Assistant og Frame TV (bytt bilde, Kunstmodus)
