<!doctype html>
<!-- The add-on's page (GET /). Relative paths: through ingress it lives under /api/hassio_ingress/<token>/.
     The text is in English: api.py puts in the strings (i18n.PAGE), and data-t says which. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame Art</title>
<style>
  :root { --bg: #111; --card: #1a1a1a; --line: #262626; --text: #eee; --dim: #999; --faint: #666; --accent: #f2c94c; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { font: 15px/1.4 system-ui, sans-serif; margin: 0; padding: 24px 16px 48px; background: var(--bg);
         color: var(--text); }
  main { max-width: 820px; margin: 0 auto; }
  a { color: var(--accent); cursor: pointer; text-decoration: none; }
  a:hover { text-decoration: underline; }

  #pic { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #222; border-radius: 10px; }
  h1 { font-size: 22px; margin: 16px 0 2px; }
  .info { color: var(--dim); margin: 0; font-size: 14px; }
  .now { display: flex; align-items: baseline; gap: 10px; margin: 14px 0 0; font-size: 14px; color: #ccc; }
  .now b { flex: none; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: #111;
           background: var(--accent); padding: 2px 8px; border-radius: 4px; }
  .note { color: var(--dim); margin: 8px 0 0; font-size: 14px; }
  .note:empty { display: none; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; }
  button { font: inherit; padding: 10px 16px; border: 0; border-radius: 8px; cursor: pointer; background: #2a2a2a;
           color: var(--text); }
  button:hover { background: #333; }
  button.small { padding: 6px 12px; font-size: 14px; }
  button:disabled { opacity: .5; cursor: default; }

  section { background: var(--card); border-radius: 12px; padding: 16px 18px; margin-top: 20px; }
  section > header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
                     margin-bottom: 8px; }
  h2 { font-size: 16px; margin: 0; }
  header .sum { color: var(--dim); font-size: 14px; }

  .group { border-top: 1px solid var(--line); padding: 10px 0 8px; }
  .group:first-of-type { border-top: 0; }
  .group-head { display: flex; align-items: center; gap: 10px; }
  .group-head label { flex: 1; font-weight: 600; display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .group-head .n { color: var(--dim); font-size: 14px; }
  .sources { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0 20px;
             margin: 4px 0 0 30px; }
  .source { display: flex; align-items: center; gap: 10px; padding: 3px 0; cursor: pointer; color: #ccc;
            font-size: 14px; }
  .source span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .source .n { flex: none; color: var(--faint); font-size: 13px; }
  input[type=checkbox] { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); cursor: pointer; }

  .dialog { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); display: flex; align-items: center;
            justify-content: center; z-index: 10; }
  .dialog > div { background: var(--card); border-radius: 12px; padding: 20px 22px; max-width: 360px; }
  .dialog p { margin: 0 0 4px; }
  button.yes { background: var(--accent); color: #111; font-weight: 600; }
  .gallery { margin: 10px 0 4px; padding: 12px; background: #141414; border-radius: 8px; }
  .gallery h3 { font-size: 13px; color: var(--dim); font-weight: 600; margin: 8px 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
  .grid img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #222;
              border-radius: 4px; cursor: pointer; }
  .grid img:hover { outline: 2px solid var(--accent); }
  .gallery .actions { margin-top: 12px; }

  .row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row > span { flex: 1; }
  .row small { display: block; color: var(--faint); font-size: 13px; }
  .row.sub { padding-left: 24px; }
  input[type=number], input[type=time] { font: inherit; background: #222; color: var(--text); border: 1px solid #333;
                                          border-radius: 6px; padding: 5px 8px; }
  input[type=number] { width: 72px; }
  .switch { position: relative; width: 40px; height: 22px; flex: none; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch i { position: absolute; inset: 0; background: #333; border-radius: 11px; pointer-events: none;
              transition: background .15s; }
  .switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
                     border-radius: 50%; background: #ccc; transition: transform .15s; }
  .switch input:checked + i { background: var(--accent); }
  .switch input:disabled, .switch input:disabled + i { opacity: .4; cursor: default; }
  .switch input:checked + i::after { transform: translateX(18px); background: #111; }
  #saved { color: var(--faint); font-size: 13px; transition: opacity .3s; }
</style></head>
<body><main>
  <img id="pic" alt="" onerror="this.style.visibility = 'hidden'" onload="this.style.visibility = ''">
  <h1 id="title">…</h1>
  <p class="info" id="info"></p>
  <p class="now"><b id="now-what"></b><span id="now"></span></p>

  <div class="actions">
    <button id="next" data-t="new_picture"></button>
    <button id="morning" data-t="show_morning"></button>
    <button id="tonight" data-t="show_tonight"></button>
  </div>
  <p class="note" id="msg"></p>

  <section>
    <header><h2 data-t="pictures"></h2><span class="sum" id="sum"></span></header>
    <p class="note" id="sources-note" style="margin: 0 0 8px"></p>
    <div id="groups"></div>
  </section>

  <div id="gallery" class="gallery" hidden>
    <p class="note" id="gallery-note"></p>
    <h3 id="recent-title" data-t="recently_shown"></h3>
    <div id="recent" class="grid"></div>
    <h3 data-t="random"></h3>
    <div id="random" class="grid"></div>
    <div class="actions">
      <button id="more" class="small" data-t="show_others"></button>
      <button id="close" class="small" data-t="close"></button>
    </div>
  </div>

  <section>
    <header><h2 data-t="settings"></h2><span id="saved"></span></header>
    <div class="row"><span data-t="interval"></span><input id="interval_minutes" type="number" min="5" max="1440"> min</div>
    <div class="row"><span><span data-t="keep"></span><small data-t="keep_note"></small></span>
      <input id="keep" type="number" min="1" max="20"></div>
    <div class="row"><span><span data-t="morning"></span><small data-t="morning_note"></small></span><input id="morning_time" type="time">
      <label class="switch"><input type="checkbox" data-setting="morning"><i></i></label></div>
    <div class="row sub" id="tv-row"><span><span data-t="tv_on"></span><small id="tv-note"></small></span>
      <label class="switch"><input type="checkbox" data-setting="morning_tv_on"><i></i></label></div>
    <div class="row"><span><span data-t="tonight"></span><small data-t="tonight_note"></small></span><input id="tonight_time" type="time">
      <label class="switch"><input type="checkbox" data-setting="tonight"><i></i></label></div>
    <div class="row"><span><span data-t="screensaver"></span><small data-t="screensaver_note"></small></span>
      <label class="switch"><input type="checkbox" data-setting="screensaver"><i></i></label></div>
    <div class="row sub"><span><span data-t="screensaver_stasera"></span><small data-t="screensaver_stasera_note"></small></span>
      <label class="switch"><input type="checkbox" data-setting="screensaver_stasera"><i></i></label></div>
    <div class="row"><span><span data-t="music"></span><small data-t="music_note"></small></span>
      <label class="switch"><input type="checkbox" data-setting="music"><i></i></label></div>
    <div class="row sub"><span data-t="music_home_only"></span>
      <label class="switch"><input type="checkbox" data-setting="music_home_only"><i></i></label></div>
  </section>

  <section>
    <header><h2>Stasera</h2></header>
    <div class="row"><span id="stasera"></span><button id="link" class="small"></button></div>
  </section>
</main>
<div id="ask" class="dialog" hidden><div>
  <p data-t="tv_off"></p>
  <p class="note" data-t="tv_off_note"></p>
  <div class="actions"><button id="ask-yes" class="yes" data-t="turn_on"></button><button id="ask-no" data-t="cancel"></button></div>
</div></div>
<script>
  var T = /*STRINGS*/{}, LOCALE = T.locale || "en-GB";
  var last = {}, open = null, savedAt = 0;
  function $(id) { return document.getElementById(id); }
  /** The text for key, with {name} filled in from values. */
  function tr(key, values) {
    return (T[key] || key).replace(/\{(\w+)\}/g, function (all, k) { return values && k in values ? values[k] : all; });
  }
  document.querySelectorAll("[data-t]").forEach(function (e) { e.textContent = tr(e.dataset.t); });
  var gal = $("gallery");  // moved under the category it shows, so its parts are found through it
  function part(id) { return gal.querySelector("#" + id); }
  function el(tag, props, kids) {
    var e = Object.assign(document.createElement(tag), props || {});
    (kids || []).forEach(function (k) { e.append(k); });
    return e;
  }
  function time(s) { return s ? new Date(s * 1000).toLocaleTimeString(LOCALE, {hour: "2-digit", minute: "2-digit"}) : "–"; }
  function day(s) {
    var d = new Date(s * 1000), today = new Date();
    return tr(d.toDateString() === today.toDateString() ? "today_at" : "tomorrow_at", {time: time(s)});
  }
  function count(n) {
    return n === null || n === undefined ? tr("reading") : n ? tr("n_pictures", {n: n.toLocaleString(LOCALE)}) :
      tr("no_pictures");
  }
  function off() { return ((last.settings || {}).sources_off || []).slice(); }
  function setOff(names, on) {
    var o = off().filter(function (n) { return names.indexOf(n) < 0; });
    if (!on) o = o.concat(names);
    save({sources_off: o});
  }

  function show(s) {
    last = s;
    var label = s.showing || "", cut = label.indexOf(": ");
    $("title").textContent = cut < 0 ? (label || tr("not_changed")) : label.slice(cut + 2);
    var source = cut < 0 ? "" : label.slice(0, cut), category = (s.source_categories || {})[source];
    $("info").textContent = [category !== source && category, source, s.changed && tr("changed_at", {time: time(s.changed)})]
      .filter(Boolean).join(" · ");
    $("pic").src = "showing.jpg?" + s.changed;
    busy(!!s.busy);
    now(s);

    sources(s);
    settings(s.settings || {}, s);
    connections(s);
  }

  // What decides what's on the wall: the same order as wanted() in service.py
  function now(s) {
    var st = s.settings || {}, what, words = [];
    if (s.wanted === "music") {
      what = tr("music");
      words = [s.music.title + " – " + s.music.artist];
    } else if (s.wanted === "fixed") {
      what = tr("fixed");
      words = [tr("fixed_until", {when: day(s.fixed.until)}),
        el("a", {textContent: tr("resume"), onclick: function () { save({mode: "shuffle"}); }})];
    } else if (s.wanted === "morning" || s.wanted === "tonight") {
      what = tr(s.wanted === "morning" ? "morning" : "tonight");
      words = [tr("coming")];
    } else if (s.wanted === "saver") {
      what = tr("saver");
      words = [tr("saver_words", {n: s.interval_minutes})];
    } else {
      var on = (s.sources || []).filter(function (n) { return off().indexOf(n) < 0; }).length;
      what = tr("rotation");
      words = [on ? tr("rotation_words", {n: st.interval_minutes, sources: tr(on === 1 ? "source_one" : "source_other",
        {n: on})}) + (s.next ? tr("next_at", {time: time(s.next)}) : "") : tr("standing")];
    }
    $("now-what").textContent = what;
    $("now").innerHTML = "";
    $("now").append.apply($("now"), words);
  }

  function sources(s) {
    var o = off(), pools = s.pools || {}, on = 0, pictures = 0, unread = 0;
    var groups = $("groups");
    groups.innerHTML = "";
    (s.categories || []).forEach(function (c) {
      var names = c.sources, ticked = names.filter(function (n) { return o.indexOf(n) < 0; });
      var all = el("input", {type: "checkbox", checked: ticked.length === names.length,
        indeterminate: ticked.length > 0 && ticked.length < names.length,
        onchange: function () { setOff(names, ticked.length < names.length); }});
      var head = el("div", {className: "group-head"}, [
        el("label", {}, [all, c.name]),
        el("span", {className: "n", textContent: count(c.pictures)}),
        el("a", {textContent: tr("choose"), onclick: function () { gallery(c.name); }})]);
      var group = el("div", {className: "group"}, [head]);
      if (names.length > 1 || names[0] !== c.name) {
        group.append(el("div", {className: "sources"}, names.map(function (n) {
          return el("label", {className: "source"}, [
            el("input", {type: "checkbox", checked: o.indexOf(n) < 0, onchange: function () { setOff([n], this.checked); }}),
            el("span", {textContent: n, title: n}), el("span", {className: "n", textContent: count(pools[n])})]);
        })));
      }
      if (open === c.name) group.append(gal);
      groups.append(group);
      names.forEach(function (n) {
        if (pools[n] === null || pools[n] === undefined) unread++;
        if (o.indexOf(n) < 0) { on++; pictures += pools[n] || 0; }
      });
    });
    var total = (s.sources || []).length;
    $("sum").textContent = tr("sum", {on: on, total: total, pictures: pictures.toLocaleString(LOCALE)});
    $("sources-note").textContent = !on ? tr("none_ticked") : unread && s.reading ? tr("reading_sources") : "";
  }

  function settings(st, s) {
    if (document.activeElement.tagName === "INPUT" && document.activeElement.type !== "checkbox") return;
    $("interval_minutes").value = st.interval_minutes;
    $("keep").value = st.keep;
    $("morning_time").value = st.morning_time || "";
    $("tonight_time").value = st.tonight_time || "";
    document.querySelectorAll("[data-setting]").forEach(function (b) { b.checked = !!st[b.dataset.setting]; });
    $("morning_time").disabled = !st.morning;
    $("tonight_time").disabled = !st.tonight;
    var tv = $("tv-row").querySelector("input");
    $("tv-row").hidden = !st.morning;
    tv.disabled = !s.tv_entity;
    if (!s.tv_entity) tv.checked = false;
    $("tv-note").textContent = tr(s.tv_entity ? "tv_on_note" : "tv_on_missing");
  }

  function connections(s) {
    var p = s.pairing, st = $("stasera");
    st.innerHTML = "";
    if (s.stasera === "off") st.textContent = tr("stasera_off");
    else if (s.stasera === "linked") st.textContent = tr("stasera_linked");
    else if (p) {
      // "Approve the code {code} in {stasera}.", with the code in bold and Stasera a link
      tr("stasera_approve").split(/(\{code\}|\{stasera\})/).forEach(function (bit) {
        st.append(bit === "{code}" ? el("b", {textContent: p.code}) :
          bit === "{stasera}" ? el("a", {href: p.url, target: "_blank", textContent: "Stasera"}) : bit);
      });
    } else st.textContent = tr("stasera_unlinked");
    $("link").textContent = tr(s.stasera === "linked" ? "unlink" : "link");
    $("link").dataset.linked = s.stasera === "linked" ? "1" : "";
    $("link").hidden = s.stasera === "off" || !!p;
  }

  function busy(b) {
    ["next", "morning", "tonight"].forEach(function (id) { $(id).disabled = b; });
  }
  function load() { fetch("status").then(function (r) { return r.json(); }).then(show).catch(function () {}); }
  // The TV off (tv_entity): ask before turning it on; then the same with &wake=1
  function act(path, doing) {
    busy(true);
    fetch("tv").then(function (r) { return r.json(); }).catch(function () { return {}; }).then(function (tv) {
      if (!tv.off) { send(path, doing); return; }
      busy(false);
      $("ask").hidden = false;
      $("ask-yes").onclick = function () {
        $("ask").hidden = true;
        busy(true);
        send(path + "&wake=1", tr("turning_on", {doing: doing}));
      };
      $("ask-no").onclick = function () { $("ask").hidden = true; };
    });
  }
  function send(path, doing) {
    $("msg").textContent = doing;
    window.scrollTo({top: 0, behavior: "smooth"});
    fetch(path, {method: "POST"}).then(function (r) { return r.json(); }).then(function (s) {
      show(s);
      $("msg").textContent = s.ok ? tr("done") : tr("failed", {error: s.error || tr("unknown_error")});
    }).catch(function () { $("msg").textContent = tr("no_answer"); load(); });
  }
  function save(changes) {
    fetch("settings", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(changes)})
      .then(function (r) { return r.json(); }).then(function (s) {
        if (s.ok) {
          $("saved").textContent = tr("saved");
          $("saved").style.opacity = 1;
          var at = savedAt = Date.now();
          setTimeout(function () { if (at === savedAt) $("saved").style.opacity = 0; }, 2000);
        } else $("msg").textContent = tr("not_saved", {error: s.error});
        if (document.activeElement.type !== "checkbox") document.activeElement.blur();
        show(s);
      }).catch(function () { $("msg").textContent = tr("couldnt_save"); });
  }

  function thumbs(box, items) {
    box.innerHTML = "";
    items.forEach(function (it) {
      box.append(el("img", {src: "thumb?key=" + encodeURIComponent(it.key), title: it.label || "", loading: "lazy",
        onerror: function () { this.remove(); },
        onclick: function () { act("show?key=" + encodeURIComponent(it.key), tr("showing_until")); }}));
    });
  }
  function gallery(name) {
    var first = open !== name;
    open = name;
    gal.hidden = false;
    if (first) {
      part("recent").innerHTML = "";
      part("random").innerHTML = "";
      part("recent-title").hidden = true;
    }
    part("gallery-note").textContent = tr("fetching");
    show(last);  // puts the gallery under its category
    fetch("category?name=" + encodeURIComponent(name)).then(function (r) { return r.json(); }).then(function (g) {
      if (open !== name) return;
      part("recent-title").hidden = !g.recent.length;
      thumbs(part("recent"), g.recent);
      thumbs(part("random"), g.random);
      part("gallery-note").textContent = g.off ? tr("gallery_off", {name: name}) : (g.reading.length ?
        tr("gallery_reading", {names: g.reading.join(", ")}) : g.random.length ? "" : tr("gallery_empty")) +
        tr("gallery_hint");
      if (first) gal.scrollIntoView({behavior: "smooth", block: "nearest"});
    }).catch(function () { part("gallery-note").textContent = tr("no_answer"); });
  }

  $("next").onclick = function () { act("next?art_mode=1", tr("fetching_new")); };
  $("morning").onclick = function () { act("next?art_mode=1&what=morning", tr("making_morning")); };
  $("tonight").onclick = function () { act("next?art_mode=1&what=tonight", tr("making_tonight")); };
  $("more").onclick = function () { if (open) gallery(open); };
  $("close").onclick = function () { open = null; gal.hidden = true; };
  $("interval_minutes").onchange = function () { save({interval_minutes: +this.value}); };
  $("keep").onchange = function () { save({keep: +this.value}); };
  $("morning_time").onchange = function () { if (this.value) save({morning_time: this.value}); };
  $("tonight_time").onchange = function () { if (this.value) save({tonight_time: this.value}); };
  document.querySelectorAll("[data-setting]").forEach(function (b) {
    b.onchange = function () { var c = {}; c[this.dataset.setting] = this.checked; save(c); };
  });
  $("link").onclick = function () {
    var linked = !!this.dataset.linked;
    fetch(linked ? "stasera/unlink" : "stasera/link", {method: "POST"}).then(function (r) { return r.json(); })
      .then(function (s) { show(s); if (!s.ok) $("stasera").textContent = s.error || tr("stasera_no_answer"); });
  };
  load();
  if (location.hash.length > 1) gallery(decodeURIComponent(location.hash.slice(1)));  // a link to a category
  setInterval(load, 30000);
  setInterval(function () { if ($("stasera").querySelector("b") || last.reading) load(); }, 3000);  // a code, or reading
</script>
</body></html>
