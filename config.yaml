# Home Assistant add-on (local): copy this folder to /addons/frame_art on the Pi, then
# Settings → Add-ons → Add-on Store → ⋮ → Check for updates → Frame Art (Local add-ons). See README.md.
name: Frame Art
version: "0.3.0"
slug: frame_art
description: Tilfeldig rotasjon i The Frames Kunstmodus, fra en mappe og fra museer (AUG-1438)
url: https://github.com/eaugum/frame-tv/tree/main/frame-art
arch: [aarch64, amd64]
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:image-frame
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: API for Home Assistant and Frame TV (bytt bilde, Kunstmodus)
map:
  - type: media
    read_only: true
options:
  tv_host: 10.1.2.36
  interval_minutes: 60
  keep: 3
  folder: true
  folder_path: /media/frame-art
  museums: true
  years: "1800-1930"
  met: true
  met_queries: [landscape, seascape]
  rijksmuseum: true
  rijksmuseum_queries: [landschap, zee]
  nasjonalmuseet: true
  nasjonalmuseet_artists: [Hans Gude, Harald Sohlberg, Edvard Munch, Nikolai Astrup, Theodor Kittelsen]
schema:
  tv_host: str
  interval_minutes: int(5,1440)
  keep: int(1,20)
  folder: bool
  folder_path: str
  museums: bool
  years: str?
  met: bool
  met_queries: [str]
  rijksmuseum: bool
  rijksmuseum_queries: [str]
  nasjonalmuseet: bool
  nasjonalmuseet_artists: [str]
